name: Data check

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"   # every Monday 09:00 UTC, after the weekly game reset
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check IDs against the GW2 API
        run: node tools/verify.js | tee verify.log
        shell: bash -o pipefail {0}
      - name: Report failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Data check failed"
          body="$(printf 'The weekly data check found IDs that no longer match the GW2 API.\n\nRun: %s/%s/actions/runs/%s\n\n```\n%s\n```' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(grep -vE '^(VAULT|cat|items checked|main script)' verify.log | head -60)")"
          existing="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
